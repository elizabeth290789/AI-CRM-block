<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интеграции Битрикс24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --integrations-text: #121212;
      --integrations-muted: #4b5563;
      --integrations-blue: #2fc6f6;
      --integrations-blue-deep: #16a9e6;
      --integrations-shadow: 0 22px 54px rgba(19, 38, 74, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Montserrat", Arial, sans-serif;
      color: var(--integrations-text);
      background: #ffffff;
    }

    .integrations-section {
      padding: clamp(64px, 8vw, 104px) 20px;
      background: #ffffff;
      font-family: "Montserrat", Arial, sans-serif;
    }

    .integrations-container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .integrations-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(420px, 1.1fr);
      gap: clamp(48px, 7vw, 96px);
      align-items: center;
    }

    .integrations-content {
      max-width: 480px;
    }

    .integrations-title {
      margin: 0;
      color: rgb(18, 18, 18);
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 36px;
      font-style: normal;
      font-weight: 700;
      line-height: 43px;
      letter-spacing: -0.02em;
    }

    .integrations-description {
      margin: 22px 0 0;
      color: var(--integrations-muted);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: -0.01em;
    }

    .integrations-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      color: #293241;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      list-style: none;
    }

    .integrations-list li {
      position: relative;
      padding-left: 18px;
    }

    .integrations-list li::before {
      content: "";
      position: absolute;
      top: 0.7em;
      left: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--integrations-blue);
    }

    .integrations-sync-text {
      margin: 20px 0 0;
      color: #293241;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.01em;
    }

    .integrations-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      margin-top: 26px;
      padding: 0 28px;
      border: 0;
      border-radius: 12px;
      background: var(--integrations-blue);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(47, 198, 246, 0.28);
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .integrations-button:hover {
      transform: translateY(-2px);
      background: var(--integrations-blue-deep);
      box-shadow: 0 16px 32px rgba(22, 169, 230, 0.3);
    }

    .integrations-visual {
      margin: 0;
    }

    .integrations-image {
      display: block;
      width: 100%;
      height: auto;
      max-width: 650px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 24px;
      box-shadow: var(--integrations-shadow);
    }

    @media (max-width: 920px) {
      .integrations-layout {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .integrations-content {
        max-width: 640px;
      }

      .integrations-visual {
        max-width: 680px;
      }
    }

    @media (max-width: 620px) {
      .integrations-section {
        padding: 52px 16px;
      }

      .integrations-title {
        font-size: 32px;
        line-height: 38px;
      }

      .integrations-description,
      .integrations-sync-text {
        font-size: 15px;
      }

      .integrations-button {
        width: 100%;
      }

      .integrations-image {
        border-radius: 18px;
        box-shadow: 0 16px 36px rgba(19, 38, 74, 0.11);
      }
    }
  </style>
</head>
<body>
  <section class="integrations-section" aria-labelledby="integrations-title">
    <div class="integrations-container">
      <div class="integrations-layout">
        <div class="integrations-content">
          <h2 class="integrations-title" id="integrations-title">5 000+ готовых интеграций</h2>

          <p class="integrations-description">
            В пару кликов подключите сервисы, которые вы используете, например:
          </p>

          <ul class="integrations-list" aria-label="Примеры интеграций">
            <li>1С</li>
            <li>телефонию</li>
            <li>онлайн-банки</li>
            <li>доставку</li>
            <li>рассылки</li>
          </ul>

          <p class="integrations-sync-text">
            Данные синхронизируются автоматически<br />
            и обновляются в реальном времени.
          </p>

          <a class="integrations-button" href="#">Получить бесплатно</a>
        </div>

        <figure class="integrations-visual">
          <img
            class="integrations-image"
            src="https://www.bitrix24.ru/upload/optimizer/converted/upload/landing/5f6/wvlz3dawhp54u0gaegz448wqp6mfekdb.1448w.png.webp?1777968076917"
            alt="Готовые интеграции Битрикс24 с популярными сервисами"
            loading="lazy"
          />
        </figure>
      </div>
    </div>
  </section>
</body>
</html>
