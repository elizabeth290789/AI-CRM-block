<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интеграции Битрикс24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --integrations-bg: #f5f7fb;
      --integrations-text: #111827;
      --integrations-blue: #247cff;
      --integrations-blue-deep: #0b5fff;
      --integrations-blue-soft: #70b7ff;
      --integrations-card: rgba(255, 255, 255, 0.82);
      --integrations-line: rgba(255, 255, 255, 0.72);
      --integrations-shadow: 0 18px 52px rgba(20, 44, 84, 0.11);
      --integrations-shadow-hover: 0 26px 68px rgba(31, 91, 171, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Montserrat", Arial, sans-serif;
      color: var(--integrations-text);
      background: #ffffff;
    }

    .integrations-section {
      position: relative;
      overflow: hidden;
      padding: clamp(72px, 9vw, 118px) 20px;
      background:
        radial-gradient(circle at 12% 18%, rgba(57, 134, 255, 0.16), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(105, 179, 255, 0.15), transparent 30%),
        linear-gradient(180deg, #fbfcff 0%, var(--integrations-bg) 100%);
      font-family: "Montserrat", Arial, sans-serif;
    }

    .integrations-section::before,
    .integrations-section::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(2px);
    }

    .integrations-section::before {
      width: 420px;
      height: 420px;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 120px rgba(36, 124, 255, 0.14);
    }

    .integrations-section::after {
      width: 180px;
      height: 180px;
      right: 8%;
      bottom: 48px;
      background: rgba(58, 140, 255, 0.09);
    }

    .integrations-container {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
    }

    .integrations-title {
      max-width: 980px;
      margin: 0 auto clamp(36px, 5.5vw, 58px);
      color: var(--integrations-text);
      font-size: clamp(34px, 4.6vw, 64px);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-align: center;
      text-wrap: balance;
    }

    .integrations-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(116px, 1fr));
      gap: 16px;
      align-items: stretch;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.3));
      box-shadow: var(--integrations-shadow);
      backdrop-filter: blur(18px);
    }

    .integration-card {
      position: relative;
      isolation: isolate;
      display: flex;
      min-height: 164px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 16px 22px;
      border: 1px solid var(--integrations-line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), var(--integrations-card)),
        rgba(255, 255, 255, 0.76);
      box-shadow: 0 12px 34px rgba(20, 44, 84, 0.07);
      text-align: center;
      transition:
        transform 260ms ease,
        box-shadow 260ms ease,
        border-color 260ms ease,
        background 260ms ease;
    }

    .integration-card::before {
      content: "";
      position: absolute;
      inset: auto 18px 14px;
      z-index: -1;
      height: 34px;
      border-radius: 999px;
      background: rgba(36, 124, 255, 0.16);
      opacity: 0;
      filter: blur(18px);
      transition: opacity 260ms ease;
    }

    .integration-card:hover {
      transform: translateY(-4px);
      border-color: rgba(69, 145, 255, 0.28);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.86)),
        rgba(255, 255, 255, 0.86);
      box-shadow: var(--integrations-shadow-hover);
    }

    .integration-card:hover::before {
      opacity: 1;
    }

    .integration-icon {
      display: grid;
      width: 70px;
      height: 70px;
      place-items: center;
      border-radius: 22px;
      background:
        radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.34), transparent 32%),
        linear-gradient(145deg, var(--integrations-blue-soft) 0%, var(--integrations-blue) 46%, var(--integrations-blue-deep) 100%);
      box-shadow:
        0 16px 34px rgba(36, 124, 255, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.34);
      transition: transform 260ms ease, box-shadow 260ms ease;
    }

    .integration-card:hover .integration-icon {
      transform: scale(1.035);
      box-shadow:
        0 20px 42px rgba(36, 124, 255, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .integration-icon svg {
      width: 32px;
      height: 32px;
      color: #ffffff;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .integration-label {
      color: #172033;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.24;
      letter-spacing: -0.015em;
    }

    @media (max-width: 1120px) {
      .integrations-grid {
        grid-template-columns: repeat(4, minmax(132px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .integrations-section {
        padding: 58px 14px;
      }

      .integrations-title {
        margin-bottom: 30px;
        font-size: clamp(30px, 10vw, 44px);
        line-height: 1.03;
        letter-spacing: -0.045em;
      }

      .integrations-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 8px;
        border-radius: 30px;
      }

      .integration-card {
        min-height: 146px;
        gap: 14px;
        padding: 20px 12px 18px;
        border-radius: 24px;
      }

      .integration-icon {
        width: 62px;
        height: 62px;
        border-radius: 20px;
      }

      .integration-icon svg {
        width: 29px;
        height: 29px;
      }
    }

    @media (max-width: 390px) {
      .integrations-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="integrations-section" aria-labelledby="integrations-title">
    <div class="integrations-container">
      <h2 class="integrations-title" id="integrations-title">
        Битрикс24 интегрируется с сервисами для повседневной работы компании
      </h2>

      <div class="integrations-grid" aria-label="Интеграции Битрикс24">
        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M10.4 6.8 8.2 8.1c-1 .6-1.4 1.8-1 2.9 2.4 6.9 6.9 11.4 13.8 13.8 1.1.4 2.3 0 2.9-1l1.3-2.2c.5-.9.3-2-.5-2.6l-3.1-2.3c-.7-.5-1.6-.5-2.3 0l-1.8 1.2a14.3 14.3 0 0 1-5.4-5.4l1.2-1.8c.5-.7.5-1.6 0-2.3L11 7.3c-.6-.8-1.7-1-2.6-.5Z" />
            </svg>
          </span>
          <span class="integration-label">Телефония</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M7 9.5h18" />
              <path d="M9.2 8 7 9.5l2.2 1.5" />
              <path d="M25 9.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 7 22.5v-8" />
              <path d="M12 17h8" />
              <path d="M12 21h5" />
            </svg>
          </span>
          <span class="integration-label">1С</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M6.5 13.2 16 7l9.5 6.2" />
              <path d="M8.5 13.5h15" />
              <path d="M10 13.5v9" />
              <path d="M16 13.5v9" />
              <path d="M22 13.5v9" />
              <path d="M8 23.5h16" />
            </svg>
          </span>
          <span class="integration-label">Онлайн-банки</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M6.5 11.5 16 6.5l9.5 5-9.5 5-9.5-5Z" />
              <path d="M6.5 11.5v9L16 25.5l9.5-5v-9" />
              <path d="M16 16.5v9" />
              <path d="m21 9.1-9.5 5" />
            </svg>
          </span>
          <span class="integration-label">Доставка</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M6.5 10.5h19v12h-19z" />
              <path d="m7.5 11.5 8.5 6 8.5-6" />
              <path d="m8.5 22 5.5-4" />
              <path d="m23.5 22-5.5-4" />
            </svg>
          </span>
          <span class="integration-label">Рассылки</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M8 12.5a7 7 0 0 1 7-5h2a7 7 0 0 1 3.4 13.1L16 24.5l-4.4-3.9A7 7 0 0 1 8 12.5Z" />
              <path d="M12.5 14.5h7" />
              <path d="M12.5 18h4.5" />
            </svg>
          </span>
          <span class="integration-label">Мессенджеры</span>
        </article>

        <article class="integration-card">
          <span class="integration-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="m12.5 10-5 6 5 6" />
              <path d="m19.5 10 5 6-5 6" />
              <path d="m17.5 8-3 16" />
            </svg>
          </span>
          <span class="integration-label">REST API</span>
        </article>
      </div>
    </div>
  </section>
</body>
</html>
